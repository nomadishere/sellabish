<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>God mode v0.9</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">

<style>
:root{--gold1:#f6e3a1;--gold2:#d4a94a;--gold3:#8a6a22;--turq:#2ee6d6;--line:rgba(212,169,74,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#f3ead2;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.02em;margin:0}
#wrap{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.hdr{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--gold2);background:#111}
.hdr h2{font-size:24px;flex:1}
.sub{font-size:12px;color:#b9ad8a}
a.link,button.link{background:none;border:0;color:var(--turq);font-size:13px;cursor:pointer;padding:6px}
#login{margin:auto 0;text-align:center;padding:24px 0}
#login h1{font-size:44px;margin-bottom:6px}
#login p{color:#b9ad8a;margin:0 0 24px}
input{width:100%;background:#0b0b0b;border:1px solid var(--line);border-radius:999px;color:#f3ead2;font-size:16px;padding:14px 18px;margin-bottom:12px;outline:none}
input:focus{border-color:var(--turq)}
.btn{width:100%;border:0;border-radius:999px;padding:14px 18px;font-size:16px;color:#1a1200;cursor:pointer;background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold3))}
#msgs{flex:1;overflow-y:auto;padding:14px 0}
.m{margin:0 0 12px;padding:10px 14px;border-radius:18px;border:1px solid var(--line);background:#0b0b0b;max-width:88%}
.m.me{margin-left:auto;border-color:var(--turq)}
.who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);margin-bottom:3px}
.m.me .who{color:var(--turq)}
.w{white-space:pre-wrap;word-wrap:break-word}
.t{font-size:10px;color:#7d7358;margin-top:4px}
form#send{display:flex;gap:8px;padding:10px 0 14px;border-top:1px solid var(--line)}
form#send input{margin:0;flex:1}
form#send .btn{width:auto;padding:0 22px}
.err{color:#ff8a8a;font-size:13px;min-height:18px;margin-top:8px}
.hide{display:none!important}
#web{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#000;display:none}
body.in #web{display:block}
#wrap{position:relative;z-index:2}
body.in #wrap{pointer-events:none}
body.in .hdr,body.in form#send,body.in .err,body.in .m,body.in #mv{pointer-events:auto}
body.in .hdr{background:rgba(0,0,0,.55);border-radius:0 0 18px 18px;padding-left:10px;padding-right:10px}
body.in .m{background:rgba(8,8,8,.5);}
body.in form#send{background:rgba(0,0,0,.55);border-radius:18px 18px 0 0;padding-left:10px;padding-right:10px;border-top:1px solid var(--line)}
body.in form#send input{background:rgba(11,11,11,.4)}
#mv{border:1px solid var(--turq);color:var(--turq);background:rgba(0,0,0,.6);border-radius:999px;font-size:12px;padding:7px 12px;cursor:pointer;white-space:nowrap}
body.in:not(.chat) #chat{display:none!important}
body.in.chat #chat{pointer-events:auto;position:fixed;right:12px;top:12px;bottom:12px;width:min(460px,calc(100vw - 24px));height:auto!important;z-index:6;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:0 14px;overflow:hidden}
body.in.chat .hdr{background:none;}
body.in.chat form#send{background:none;}
@media(max-width:600px){body.in.chat #chat{left:8px;right:8px;top:8px;bottom:8px;width:auto}}
#mic{display:none;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--turq);background:rgba(0,0,0,.55);color:var(--turq);cursor:pointer;padding:0;align-items:center;justify-content:center}
#mic.ok{display:inline-flex}
#mic svg{width:20px;height:20px;fill:currentColor}
#mic.on{background:var(--turq);color:#000;animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(64,224,208,.7)}50%{box-shadow:0 0 14px 6px rgba(64,224,208,.55)}}
#bar{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:7;gap:2px;padding:4px;border-radius:14px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)}
body.in #bar{display:flex}
#bar button{background:none;border:0;color:#cfeee9;font:500 13px system-ui,sans-serif;letter-spacing:.04em;padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
#bar button:hover,#bar button.on{background:rgba(64,224,208,.16);color:#40E0D0}
#bar button span{font-size:10px;opacity:.7}
#ppl{display:none;position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:8;width:min(300px,calc(100vw - 24px));max-height:70vh;overflow:auto;padding:8px;border-radius:16px;background:rgba(6,6,8,.88);border:1px solid rgba(255,255,255,.12)}
#ppl.show{display:block}
#ppl .h{font:600 10px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#d9b95a;padding:10px 8px 4px}
#ppl button{display:block;width:100%;text-align:left;background:none;border:0;color:#eaf7f5;font:14px system-ui,sans-serif;padding:8px;border-radius:8px;cursor:pointer}
#ppl button:hover{background:rgba(64,224,208,.14)}
#ppl small{opacity:.55;margin-left:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.55);color:#40E0D0;font:14px system-ui,sans-serif;padding:10px 16px;border-radius:12px;border:1px solid rgba(64,224,208,.4);opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}
body.in.chat #chat{top:60px}
@media(max-width:700px){#bar button{padding:8px 8px;font-size:12px}}
</style></head><body><iframe id="web" title="Indra roots web" allow="fullscreen"></iframe><div id="bar"><button id="bchat" type="button">Chat</button><button id="bppl" type="button">People <span>&#9662;</span></button><button id="bgame" type="button">Game</button><button id="bmode" type="button">Say a mode</button><button id="bsend" type="button">Send to chat</button></div>
<div id="ppl"><div class="h">Group chats</div><button data-k="chat">God mode chat <small>Izzy, Waz and Juicy</small></button><div class="h">Agents</div><button data-k="chat">Izzy</button><button data-k="chat">Waz</button><button data-k="soon">Ace</button><button data-k="soon">Jayden</button><button data-k="soon">Michelle</button><button data-k="soon">Mosaic</button><div class="h">Top nine</div><button data-k="soon">Empress Alexandra</button><button data-k="soon">Joey</button><button data-k="soon">Mom</button><button data-k="soon">Ace</button><button data-k="soon">Joey (second)</button><button data-k="soon">Sydney</button><button data-k="soon">Nusheen</button><button data-k="soon">Naomi</button><button data-k="soon">Cath</button></div><div id="toast"></div><div id="wrap">

<div id="login">
  <h1 class="gold">God mode</h1>
  <p>Private. Only the people inside can see this.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="go">Sign in</button>
  <div class="err" id="err"></div>
</div>

<div id="chat" class="hide" style="display:flex;flex-direction:column;height:100%">
  <div class="hdr">
    <img class="av" src="https://sellabish.com/img/tina-face-nomakeup.jpg" alt="" onerror="this.style.visibility='hidden'">
    <div style="flex:1"><h2 class="gold">God mode</h2><div class="sub" id="conv">Private. Only members can see this.</div></div>
    <button id="mv" type="button">Close</button><button class="link" id="out">Sign out</button>
  </div>
  <div id="msgs"></div>
  <div class="err" id="err2"></div>
  <form id="send"><input id="tx" placeholder="Say something" autocomplete="off"><button id="mic" type="button" aria-label="Talk" title="Talk"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12z"/></svg></button><button class="btn" type="submit">Send</button></form>
</div>

</div>
<script>
var U="https://cstozxwrwbaufyzbetba.supabase.co",K="sb_publishable_RLZzx3hwpm9Dvv0qfDq-dA_FlabMEGO";
var CONV="da93f4e2-21d9-4044-89fc-a80b279c6a36",SK="godmode_session_v1";
var S=null,me=null,last=0,timer=null;
function $(i){return document.getElementById(i)}
function hdr(){return{apikey:K,Authorization:"Bearer "+(S?S.access_token:K),"Content-Type":"application/json"}}
function save(){try{localStorage.setItem(SK,JSON.stringify({a:S.access_token,r:S.refresh_token,e:S.expires_at}))}catch(e){}}
function load(){try{var j=JSON.parse(localStorage.getItem(SK)||"null");return j}catch(e){return null}}
function clear(){try{localStorage.removeItem(SK)}catch(e){}}
function take(j){S={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};save()}
function auth(body,grant){return fetch(U+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"sign-in failed");return j})})}
function refresh(){var s=load();if(!s||!s.r)return Promise.reject(new Error("none"));return auth({refresh_token:s.r},"refresh_token").then(take)}
function nm(n){return n==="Waz"?"CEO Waz":n}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function enter(){
  fetch(U+"/auth/v1/user",{headers:hdr()}).then(function(r){return r.json()}).then(function(u){
    if(!u||!u.id)throw new Error("session ended");
    return fetch(U+"/rest/v1/members?user_id=eq."+u.id+"&select=member&limit=1",{headers:hdr()})
  }).then(function(r){return r.json()}).then(function(a){
    if(!a||!a.length)throw new Error("This login is not a member of God mode.");
    me=a[0].member;document.body.classList.add("in");if(!/[?&]web=0/.test(location.search)){if(!$("web").getAttribute("src"))$("web").setAttribute("src","/indra/roots/")}else document.body.classList.add("chat");$("login").classList.add("hide");$("chat").classList.remove("hide");poll();timer=setInterval(function(){if(!document.hidden)poll()},4000)
  }).catch(function(e){clear();S=null;document.body.classList.remove("in","web");$("web").removeAttribute("src");$("login").classList.remove("hide");$("chat").classList.add("hide");$("err").textContent=e.message})
}
function poll(){
  fetch(U+"/rest/v1/messages?conversation_id=eq."+CONV+"&order=created_at.desc&limit=80&select=id,speaker_name,words,created_at",{headers:hdr()})
  .then(function(r){if(r.status===401){return refresh().then(poll).then(function(){throw 0})}return r.json()})
  .then(function(a){if(!Array.isArray(a))return;a.reverse();
    var tail=a.length?a[a.length-1].id:0;if(tail===last&&a.length===document.querySelectorAll(".m").length)return;last=tail;
    var h="";a.forEach(function(m){var mine=m.speaker_name===me;var d=new Date(m.created_at);
      h+='<div class="m'+(mine?' me':'')+'"><div class="who">'+esc(nm(m.speaker_name))+'</div><div class="w">'+esc(m.words)+'</div><div class="t">'+d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+'</div></div>'});
    var box=$("msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.innerHTML=h;if(near||!box.dataset.s){box.scrollTop=box.scrollHeight;box.dataset.s=1}
    $("err2").textContent=""
  }).catch(function(e){if(e)$("err2").textContent="Cannot reach the database."})
}
$("go").onclick=function(){$("err").textContent="";
  auth({email:$("em").value.trim(),password:$("pw").value},"password").then(function(j){$("pw").value="";take(j);enter()}).catch(function(e){$("err").textContent=e.message})};
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").onclick()});
$("send").onsubmit=function(e){e.preventDefault();var t=$("tx").value.trim();if(!t)return;
  fetch(U+"/rest/v1/messages",{method:"POST",headers:Object.assign(hdr(),{Prefer:"return=minimal"}),body:JSON.stringify({conversation_id:CONV,speaker_name:me,words:t})})
  .then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error(x)});$("tx").value="";poll()}).catch(function(e){$("err2").textContent="Not sent: "+e.message})};
$("mv").onclick=function(){document.body.classList.remove("chat")};
$("out").onclick=function(){clear();S=null;me=null;clearInterval(timer);location.reload()};
(function(){var s=load();if(s&&s.r){S={access_token:s.a,refresh_token:s.r,expires_at:s.e};
  if(s.e&&s.e*1000<Date.now()+60000){refresh().then(enter).catch(function(){clear();S=null})}else enter()}})();

(function(){var R=window.SpeechRecognition||window.webkitSpeechRecognition,b=document.getElementById("mic");if(!R||!b)return;b.classList.add("ok");
var r=null,on=false,base="";
function stop(){on=false;b.classList.remove("on");try{r&&r.stop()}catch(e){}}
b.onclick=function(){if(on){stop();return}
 r=new R();r.continuous=true;r.interimResults=true;r.lang=navigator.language||"en-US";
 var tx=document.getElementById("tx");base=tx.value?tx.value.replace(/\s+$/,"")+" ":"";
 r.onresult=function(e){var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;tx.value=base+t.trim()};
 r.onend=function(){on=false;b.classList.remove("on");tx.focus()};
 r.onerror=function(e){on=false;b.classList.remove("on");if(e.error==="not-allowed"||e.error==="service-not-allowed")document.getElementById("err2").textContent="Mic is blocked. Allow the microphone for this site in the browser."};
 try{r.start();on=true;b.classList.add("on")}catch(e){}};
document.getElementById("send").addEventListener("submit",function(){if(on)stop()},true)})();

(function(){var GAME="http://100.90.60.123:8000/kira";
function T(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(T.h);T.h=setTimeout(function(){t.classList.remove("show")},3200)}
function W(){var f=document.getElementById("web");try{return f&&f.contentWindow&&f.contentWindow.flyTo?f.contentWindow:null}catch(e){return null}}
function ppl(on){document.getElementById("ppl").classList.toggle("show",on);document.getElementById("bppl").classList.toggle("on",on)}
document.getElementById("bchat").onclick=function(){ppl(false);document.body.classList.toggle("chat")};
document.getElementById("bppl").onclick=function(){ppl(!document.getElementById("ppl").classList.contains("show"))};
document.getElementById("ppl").onclick=function(e){var b=e.target.closest("button");if(!b)return;ppl(false);if(b.dataset.k==="chat")document.body.classList.add("chat");else T(b.firstChild.textContent.trim()+": chat opens here soon. Sending to people waits for your yes.")};
document.getElementById("bgame").onclick=function(){T("Opening the Kira game. It works on devices signed into your Tailscale.");window.open(GAME,"_blank","noopener")};
document.getElementById("bsend").onclick=function(){var w=W();if(!w){T("Load the web first.");return}try{var d=w.document,ct=d.getElementById("ct").textContent.trim(),cp=d.getElementById("cp").textContent.trim();if(!ct){T("Tap an orb first, then Send to chat.");return}var tx=document.getElementById("tx");tx.value=(tx.value?tx.value+" ":"")+"[orb: "+ct+(cp?" - "+cp.slice(0,240):"")+"] ";document.body.classList.add("chat");tx.focus();T("Orb added to your message. Press Send when ready.")}catch(e){T("Could not read that orb.")}};
function go(word,label){var w=W();if(!w){T("Load the web first.");return}try{w.goWord(word);T(label)}catch(e){T(label+" did not find it.")}}
var MODES={family:function(){go("family","Family mode")},dad:function(){go("dad","Dad mode")},anniversary:function(){go("anniversary","Anniversary mode")},video:function(){go("anniversary","Video mode: showing the anniversary")},"2019":function(){go("2019","2019 mode")},feeling:function(){go("feeling","Feeling mode")},web:function(){var w=W();if(w){try{w.cam.k=1;T("Web mode: all of it")}catch(e){T("Web mode")}}else T("Load the web first.")},spread:function(){MODES.web()},bloom:function(){var w=W();if(w){try{w.cam.k=Math.min(6,(w.cam.k||1)*1.8);T("Bloom mode: closer")}catch(e){T("Bloom mode")}}},open:function(){T("Open mode: tap an orb to open its card.")},library:function(){T("Library mode: first version coming.")},shelf:function(){T("Shelf mode: first version coming.")},book:function(){T("Book mode: first version coming.")},brain:function(){T("Brain mode: first version coming.")}};
var R=window.SpeechRecognition||window.webkitSpeechRecognition,bm=document.getElementById("bmode"),rec=null,on=false;
if(!R){bm.style.display="none"}else bm.onclick=function(){if(on){try{rec.stop()}catch(e){}return}
 rec=new R();rec.continuous=false;rec.interimResults=false;rec.lang=navigator.language||"en-US";
 rec.onresult=function(e){var t=e.results[0][0].transcript.toLowerCase();var m=t.match(/([a-z0-9]+)\s+mode/),k=m&&m[1];if(k&&MODES[k])MODES[k]();else T('Heard "'+t+'". Say a mode, like "family mode".')};
 rec.onend=function(){on=false;bm.classList.remove("on");bm.textContent="Say a mode"};
 rec.onerror=function(){on=false;bm.classList.remove("on");bm.textContent="Say a mode"};
 try{rec.start();on=true;bm.classList.add("on");bm.textContent="Listening..."}catch(e){}};
})();
</script></body></html>
